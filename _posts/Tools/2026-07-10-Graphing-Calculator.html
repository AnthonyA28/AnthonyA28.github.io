RULES
Variables may use letter/digit subscripts (for example P_{ab}); case matters.
Write 12\cdot n, \frac{a}{b}, and
0.065 for 6.5%. Import/export uses one row per line.

INPUT
  y=\sin(x)          function       x=y^5        function of y
  f=x^2              reusable function; f(2) evaluates to 4
  t_{2}=x            subscripts work; t_{2}(4) evaluates to 4
  x=6                vertical       y=6          horizontal
  (0,3)              point          [(0,3),(1,2)] point list
  a=[-2,-1,0,1,2]    parameter list; then use a\cdot x^2, y=a, or x=a
  \ln(x) is natural log; \log(x) is base 10.

FUNCTIONS
A named equation with one free input becomes callable. The input does not
have to be x: z=u^2 followed by z(3) evaluates to 9. Functions can call
other functions, and names such as t_{2} keep their subscripts.

ZEROS
  f=x^2-4
  zero(f)             returns [-2, 2]
  zero(x^2-4,-3,0)    direct expression; searches -3 through 0
  z=zero(f)           stores the roots in z for later use
The first argument may be a named one-input function or any expression with
exactly one free input variable, for example zero(M_f(x)-0.50,0,t_max).
Without explicit bounds, zero(...) searches the current x-axis range. Used
by itself or as the complete right side of an assignment it returns an array,
including [] when no roots are found. Inside a larger expression, zero(...)
must resolve to exactly one root and that root is used as a scalar value:
  h=\frac{\operatorname{zero}(M_f-0.9)}{3600}
One-value parameter arrays are treated as scalars when evaluating zero bounds.
For example, L=[20] works in zero(f,0,2*L^2/D).

ARRAYS
  a=[1,2,3]          numeric array
  y=a\cdot x^2       plots three curves
  y=a\cdot2          displays [2, 4, 6] and plots three horizontal lines
  a^2, 2/a, \sin(a)  apply to every value
  a[1]               first value (array indexes start at 1)
Equal-length arrays pair by position. A one-value array broadcasts; other
length mismatches are reported as errors. Results and function calls may
also return arrays.

COMMENTS
Start a blank row with " for a full-line comment, or type " after an equation
for an inline comment. Quotes cannot occur inside comments. In PDFs, <F>
references named equation F.

PLOT SETTINGS
Use the gear panel for x/y ranges and axis labels. They are saved with sets
and written to text export as hidden plot_ranges, x_label, and y_label records.

CONTROLS
Top DP changes all results; row DP (under ×) sets 0-12 places for one result.
The checkbox controls visibility. The color circle sets color and line style.
Hover a variable in an equation to see the comment from its latest definition above.
Mobile: use Keypad pages ABC, 123, fn, and Greek; the device keyboard is off.

TEXT FORMAT
  F=P\cdot(1+r)^n "future value" DP[2]
  y=\sin(x) "wave" color[blue] line[dash] show[true]
  "A full-line comment"
Settings follow the closed comment and are hidden in the inputter/PDF. Import
restores plot settings, DP, color, style, and visibility; old files still load.

Saved sets preserve all settings. Built-in examples cannot be deleted. PDFs
can include numbered equations, results, comments, references, and the plot.
Excel export puts constants and scalar-derived calculations in a row-wise block
at the left: column A is Variable, B is Value/formula, and C is Comment. Column
D is a spacer. Any quantity that ultimately depends only on constants is written
once in column B with absolute references. The calculation table starts in column
E with x; only x-dependent outputs are repeated over rows 3 through 102. Constant
parameter arrays and arrays derived only from constants use one row per element.
Points, graph-only x relations, and root searches are documented instead of
being replaced with misleading static formulas.`;
